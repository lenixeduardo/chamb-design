name: CI

on:
  push:
    # The default branch is what Vercel deploys to production, so it has to be
    # verified on push and not only through pull requests.
    branches: [main, claude/opendesign-ai-platform-a93toq]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma needs a URL to generate; no database is contacted during CI.
  DATABASE_URL: postgresql://opendesign:opendesign@localhost:5432/opendesign

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. `packageManager` in package.json is the
      # single source of truth; specifying both makes the action abort with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm prettier --check "**/*.{ts,tsx,md,json}"
